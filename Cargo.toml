[package]
name = "dirhop"
version = "0.1.0"
edition = "2024"
description = "Jump to any folder in a few keystrokes: a fast fuzzy directory picker for your terminal"
license = "MIT"
repository = "https://github.com/jx-grxf/dirhop"
readme = "README.md"
keywords = ["cli", "tui", "fuzzy", "cd", "directory"]
categories = ["command-line-utilities"]

[dependencies]
ignore = "0.4"
nucleo-matcher = "0.3"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
